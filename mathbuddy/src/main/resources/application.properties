
# MathBuddy - Application Configuration

# Server Port
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.timeout=30000

# Jackson JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.mathbuddy=DEBUG
logging.level.org.springframework.web=INFO
