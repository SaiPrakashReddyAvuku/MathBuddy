# =============================================
# MathBuddy - Application Configuration
# =============================================

# Server Port
server.port=8080

# =============================================
# Database Configuration (MySQL)
# Default connects to localhost:3306/mathbuddy
# Automatically creates the database if it doesn't exist
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/mathbuddy?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto-DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Gemini AI API Configuration
# Reads GEMINI_API_KEY or GOOGLE_API_KEY from environment
# Never hardcoded, never exposed to frontend
# =============================================
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
gemini.api.model=${GEMINI_API_MODEL:gemini-1.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.api.timeout=30000

# =============================================
# Jackson JSON
# =============================================
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# =============================================
# Logging
# =============================================
logging.level.com.mathbuddy=DEBUG
logging.level.org.springframework.web=INFO
